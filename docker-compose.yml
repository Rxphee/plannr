services:
  postgres:
    image: mirror.gcr.io/library/postgres:18
    pull_policy: weekly
    tty: true
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker and expects
      # /var/lib/postgresql itself to be mounted.
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRESQL_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DB}

  # Stands in for Zitadel during development: a realm with fixed users, see README.md.
  # The realm is imported on the first start; recreate the container to import changes.
  oidc-provider:
    image: quay.io/keycloak/keycloak:26.8
    pull_policy: weekly
    command: start-dev --import-realm
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${OIDC_PROVIDER_PORT}:8080"
    environment:
      # Placeholders in the realm file
      WEB_URL: http://localhost:${WEB_PORT}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}

volumes:
  postgres:
    driver: local
