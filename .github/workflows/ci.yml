name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Lint root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:ci

  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run setup:ci
      - run: npm --prefix ${{ matrix.package }} ci
      - run: npm --prefix ${{ matrix.package }} run lint:ci
      - run: npm --prefix ${{ matrix.package }} run test:ci --if-present
      - run: npm --prefix ${{ matrix.package }} run build
