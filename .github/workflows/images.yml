name: Images

# main only takes pull requests with green CI, so every commit on it gets its images
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          # Image names must be lowercase, the owner is not
          images: ghcr.io/rxphee/plannr-${{ matrix.package }}
          # main follows the branch, sha-<commit> stays fixed for a deployment that pins it
          tags: |
            type=raw,value=main
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.package }}/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
