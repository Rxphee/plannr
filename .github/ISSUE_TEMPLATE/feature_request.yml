name: Feature request
description: Suggest an idea for Plannr
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Plannr stays lean on purpose, with clear defaults instead of many options. So please start from the problem, not from a solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you suggest?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
